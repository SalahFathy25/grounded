# Grounded — single-container deployment (API + React frontend + database)
# Database: SQLite by default (persisted in the `grounded-data` volume).
# Set DB_URL (postgres:// or jdbc:postgresql://) to use PostgreSQL instead.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: grounded-api
    ports:
      - "80:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      DB_URL: ${DB_URL:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - grounded-data:/app/data
    restart: unless-stopped

volumes:
  grounded-data:
