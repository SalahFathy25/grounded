services:
  db:
    image: postgres:16-alpine
    container_name: shopverse-db
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: shopverse
      POSTGRES_PASSWORD: shopverse
    ports:
      - "5432:5432"
    volumes:
      - shopverse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopverse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shopverse-data:
