services:
  - type: web
    name: shopverse-api
    runtime: docker
    repo: https://github.com/SalahFathy25/shopverse
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/settings
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false