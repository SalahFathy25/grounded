server:
  port: 8080

spring:
  application:
    name: shopverse-api
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # Override in production via env: JWT_SECRET
    secret: ${JWT_SECRET:shopverse-dev-secret-change-me-in-production-0123456789}
    expiration-ms: 86400000
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin:
    # Override in production via env: ADMIN_INITIAL_PASSWORD
    initial-password: ${ADMIN_INITIAL_PASSWORD:admin123}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:shopverse;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DB_USER:shopverse}
    password: ${DB_PASSWORD:shopverse}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true